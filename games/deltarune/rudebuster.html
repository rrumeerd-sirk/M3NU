        <style data-savepage-href="css/style.css">@font-face {
    font-family: "undertale";
    src: /*savepage-url=../font/DTM-Mono.otf*/ url();
}

.body {
    background-color: black;
    font-family: "undertale";
    color: white;
    position: relative;
}


@keyframes outside-stripes {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 800px 0, 800px 0; }
}

.flexContainer {
    display: flex;
    justify-content: center;
    margin-top: 21vh;
}

.zone {
    width: 80vh;
    height: 60vh;
    background-color: black;
    border: solid 2px white;
    margin: 0 2px;
    position: relative;
    overflow: hidden;
    z-index: 2;
}

/* remove dots from battle box */
.zone::before {
    display: none;
}

/* animated Deltarune-style battle background */
.zone::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        repeating-linear-gradient(-45deg, rgba(146,39,143,0.06) 0 6px, rgba(255,255,255,0) 6px 12px),
        linear-gradient(180deg, rgba(18,18,38,0.9), rgba(6,6,18,0.95));
    background-size: 200% 200%, cover;
    background-position: 0 0, center;
    mix-blend-mode: overlay;
    opacity: 0.9;
    pointer-events: none;
    z-index: 1;
    animation: dr-stripes 9s linear infinite, dr-pulse 6s ease-in-out infinite;
}

.heart {
    width: 7vh;
    position: absolute;
    z-index: 4;
}

@keyframes dr-stripes {
    from { background-position: 0 0, center; }
    to   { background-position: 400px 0, center; }
}

@keyframes dr-pulse {
    0%   { opacity: 0.85; filter: hue-rotate(0deg) saturate(1); }
    50%  { opacity: 0.95; filter: hue-rotate(6deg) saturate(1.05); }
    100% { opacity: 0.85; filter: hue-rotate(0deg) saturate(1); }
}

.hpContainer {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2vh;
}

.lv {
    font-size: 4vh;
}

.hp {
    text-transform: uppercase;
    font-size: 3vh;
    margin-left: 10vh;
}

.hpBar[value] {
    -webkit-appearance: none;
    appearance: none;
    width: 11vh;
    height: 4vh;
    margin-left: 1vh;
}

.hpBar[value]::-webkit-progress-bar {
  background-color: red;
}

.hpBar[value]::-webkit-progress-value {
  background-color: yellow;
}

.hpNumber {
    margin-left: 3vh;
    font-size: 3.5vh;
