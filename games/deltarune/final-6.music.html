<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gemene buster</title>
<style>
/* gebruik de ut font. anders gwn courier new.  */
@font-face{font-family:undertale;src:local("Determination Mono"),url("font/DTM-Mono.otf")}
body{margin:0;background:#000;color:#fff;font-family:undertale,"Courier New",monospace}
canvas{display:block;margin:auto;width:min(100vw,1200px);height:auto;image-rendering:pixelated;touch-action:none}
/* mobiele knoppen (alleen op touch) */
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;z-index:5}
#pad[hidden]{display:none}
#pad>*{pointer-events:auto}
#dpad{position:relative;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.5);touch-action:none}
#dpad i{position:absolute;width:0;height:0;border:0 solid transparent;opacity:.6}
#dpad i.on{opacity:1;filter:drop-shadow(0 0 4px #fff)}
#dpad .u{left:64px;top:14px;border-width:0 11px 18px;border-bottom-color:#fff}
#dpad .d{left:64px;bottom:14px;border-width:18px 11px 0;border-top-color:#fff}
#dpad .l{left:14px;top:64px;border-width:11px 18px 11px 0;border-right-color:#fff}
#dpad .r{right:14px;top:64px;border-width:11px 0 11px 18px;border-left-color:#fff}
#acts{display:flex;align-items:flex-end;gap:14px}
#acts button{width:68px;height:68px;border-radius:50%;padding:0;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.5);color:#fff;font:inherit;font-size:26px;touch-action:none;-webkit-tap-highlight-color:transparent}
#acts button.on{background:rgba(255,255,255,.35)}
#bA{margin-bottom:44px}
#bN{display:none;width:52px;height:52px;font-size:20px}
/* room editor */
#editor{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;gap:6px;padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));background:rgba(0,0,0,.88);border-top:2px solid #555;z-index:6;user-select:none;-webkit-user-select:none;font-size:15px}
body.editing #editor{display:flex}
body.editing #pad{display:none!important}
#editor .row{display:flex;flex-wrap:wrap;gap:6px}
#editor button.on{border-color:#ff0;color:#ff0}
#editor button,#edBtn{font:inherit;color:#fff;background:#222;border:2px solid #777;padding:4px 10px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#editor button:hover,#edBtn:hover{border-color:#ff0}
#edBtn{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:6;background:rgba(0,0,0,.55);opacity:.75}
/* muziek paneel (knop I) */
#music{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);z-index:9}
#music .mbox{background:#000;border:3px solid #fff;padding:12px 16px;max-width:min(560px,94vw);max-height:92vh;overflow:auto;font-size:15px}
#music .mh{color:#ff0;margin-bottom:8px}
#music .mrow{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
#music .mi{flex:1 1 150px;min-width:130px}
#music .ms{color:#999;font-size:12px}
#music .msg{color:#f77;min-height:18px;font-size:13px}
#music button{font:inherit;color:#fff;background:#222;border:2px solid #777;padding:3px 8px;cursor:pointer;touch-action:manipulation}
#music button.on{border-color:#ff0;color:#ff0}
#music button:disabled{opacity:.4;cursor:default}
#musBtn{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:6;font:inherit;color:#fff;background:rgba(0,0,0,.55);border:2px solid #777;padding:4px 10px;opacity:.75;cursor:pointer;touch-action:manipulation}
#musBtn:hover{border-color:#ff0}
#muteBtn{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 40px);left:max(8px,env(safe-area-inset-left));z-index:6;font:inherit;color:#fff;background:rgba(0,0,0,.55);border:2px solid #777;padding:4px 10px;opacity:.75;cursor:pointer;touch-action:manipulation}
#muteBtn:hover{border-color:#ff0}
#owStart{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:20}
#owStart button{font:inherit;font-size:28px;color:#fff;background:#222;border:3px solid #fff;padding:10px 32px;cursor:pointer}
#owStart button:hover{border-color:#ff0;color:#ff0}
</style>

<body>
<!-- alles in 1 canvas -->
<canvas id="game"></canvas>
<button id="bt" type="button"></button>
<!-- mobiele knoppen: dpad + A (praten) + N (volgende aanval, alleen in battle) -->
<button id="edBtn" type="button">bewerk</button>

<button id="muteBtn" type="button">mute</button>

<div id="music"></div>
<div id="pad" hidden>
  <div id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
  <div id="acts">
    <button id="bN" type="button">N</button>
    <button id="bA" type="button">A</button>

<script>
// =====================
// doos dialoog
// =====================

const DIALOOG = {
  up:    ["* Doos 1."],
  left:  ["* Doos 3."],
  right: ["* Doos 4."],
  front: ["* Doos 5."],
  back:  ["* Doos 6."],
  // als je alles inspecteerd. HOEZO??
  alles: ["* je hebt alles geinspecteerd"]
};
// hoe snel de letters verschijnen (hoger = sneller)
const TYPSNELHEID = 0.6;

// =====================
// config
// =====================
// grootes
const SCALE = 3, SPR_W = 16, SPR_H = 30;     // sprite
const BASE_W = 400, BASE_H = 200;            // groote loop veld kris
// gevecht instellingen
const BATTLE_TIME = 15 * 60; // gevecht duurt 15 sec (60 fps)
const ZW = 380, ZH = 380, HS = 40, PLEN = 720; // gevecht gebied groote enz

// canvas naar de overworld groote veranderen.
const canvas = document.getElementById("game");
canvas.width = BASE_W * SCALE;
canvas.height = BASE_H * SCALE;
const ctx = canvas.getContext("2d");
const ZX = (canvas.width - ZW) / 2, ZY = (canvas.height - ZH) / 2;
// de font voor alles
const FONT = "undertale,'Courier New',monospace";

// =====================
// knoppen -pijlen -wasd -muis?(OSU)
// =====================
const keys = {};
const K = (...n) => n.some(k => keys[k]);
let ptr = null;
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k.startsWith("arrow") || k === " ") e.preventDefault();
  if (!keys[k]) onPress(k);
  keys[k] = true;
});

addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
// buiten focus laat alle knoppen los
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
// muis naar bewegings script
function pt(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
}
// muis shit
canvas.addEventListener("pointerdown", e => { const p = pt(e); if (mode === "edit") { editDown(e, p); return; } if (mode === "world" && clickWorld(p)) return; ptr = p; });
canvas.addEventListener("pointermove", e => { if (mode === "edit") { editMove(pt(e)); return; } if (ptr) ptr = pt(e); });
addEventListener("pointerup", () => { if (mode === "edit") editUp(); ptr = null; });

// =====================
// mobiele knoppen (dpad, A, B, N)
// =====================
const pad = document.getElementById("pad"), dpad = document.getElementById("dpad");
const bA = document.getElementById("bA"), bN = document.getElementById("bN");
// laat de knoppen zien op touch apparaten (of bij de eerste aanraking)
if (matchMedia("(pointer: coarse)").matches) pad.hidden = false;
addEventListener("pointerdown", e => { if (e.pointerType === "touch") pad.hidden = false; });
pad.addEventListener("contextmenu", e => e.preventDefault());
// dpad: zelfde toetsen als de pijltjes, je kan ook over de dpad slepen
const DIRS = { u: "arrowup", d: "arrowdown", l: "arrowleft", r: "arrowright" };
function dpadSet(e) {
  const r = dpad.getBoundingClientRect();
  const x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
  const on = { l: x < -0.3, r: x > 0.3, u: y < -0.3, d: y > 0.3 };
  for (const d in DIRS) { keys[DIRS[d]] = on[d]; dpad.querySelector("." + d).classList.toggle("on", on[d]); }
}
function dpadOff() { for (const d in DIRS) { keys[DIRS[d]] = false; dpad.querySelector("." + d).classList.remove("on"); } }
dpad.addEventListener("pointerdown", e => { e.preventDefault(); dpad.setPointerCapture(e.pointerId); dpadSet(e); });
dpad.addEventListener("pointermove", e => { if (dpad.hasPointerCapture(e.pointerId)) dpadSet(e); });
dpad.addEventListener("pointerup", dpadOff);
dpad.addEventListener("pointercancel", dpadOff);
// A = e (praten), N = n (volgende aanval)
function padBtn(id, key) {
  const b = document.getElementById(id), up = () => b.classList.remove("on");
  b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("on"); onPress(key); });
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("pointerleave", up);
}
padBtn("bA", "e"); padBtn("bN", "n");
// in battle: N erbij, A weg
let padMode = "";
function padSync() {
  if (mode === padMode) return;
  padMode = mode;
  edBtn.style.display = (mode === "world" || mode === "edit") ? "" : "none";
  edBtn.textContent = mode === "edit" ? "speel" : "bewerk";
  musBtn.style.display = (mode === "world" || mode === "edit") ? "" : "none";
  bN.style.display = mode === "battle" ? "block" : "none";
  bA.style.display = mode === "battle" ? "none" : "";
}

// bewegings richtingen
function vec(cx, cy) {
  let dx = (K("arrowright", "d") ? 1 : 0) - (K("arrowleft", "q", "a") ? 1 : 0);
  let dy = (K("arrowdown", "s") ? 1 : 0) - (K("arrowup", "z", "w") ? 1 : 0);
  if (!dx && !dy && ptr) {
    const vx = ptr.x - cx, vy = ptr.y - cy, d = Math.hypot(vx, vy);
    if (d > 8) { dx = vx / d; dy = vy / d; }
  }
  return [dx, dy];
}

// =====================
// sprite
// =====================
// foto maken en laden

// animatie status en snelheid
const player = { x: BASE_W / 2 - SPR_W / 2, y: BASE_H / 2 - SPR_H / 2, speed: 2, dir: "down", frame: 0, timer: 0, moving: false };
// alle status modussen
let mode = "world", tr = 0, fr = 0, bt = null;
let worldIdx = 0, warp = null, posterLock = false; // worldIdx: 0 = eerste wereld, 1 = tweede wereld (via de poster)
const btn = document.getElementById("bt");
btn.onclick = () => { toggle(); btn.blur(); };

// overworld/battle toggle switch
function toggle() {
  if (mode === "edit" || warp) return;
  if (mode === "world") { mode = "trans"; tr = 0; dlg = null; owSync(); }
  else {
    mode = "world"; ptr = null; stopMusic();
    if (fighting) fighting.alive = false; // na het gevecht is die enemy weg
    fighting = null; respawnEnemies();
  }
  btn.textContent = mode === "world" ? "" : "";
}
// hp. geen bullets. alles vers laden
let lastPat = -1;
function startBattle() {
  mode = "battle";
  const T = fighting ? etype(fighting) : ETYPES[0]; // welke soort vijand?
  bt = { hx: (ZW - HS) / 2, hy: ZH * 0.65, hp: 20, inv: 0, dead: 0, pat: 0, pat2: -1, t: 0, tt: 0, acc: 0, pause: 60, auto: true, bul: [], left: T.time * 60, T };
  let pat;
  do pat = pickPat(); while (pat === lastPat && T.pats.length > 1);
  lastPat = pat; bt.pat = pat; bt.pat2 = pickPat2();
  playTrack(trackFor(fighting));
}
// kies een aanval uit de lijst van deze vijand
const pickPat = () => bt.T.pats[Math.random() * bt.T.pats.length | 0];
// rakuichi buster doet 2 aanvallen tegelijk (nooit 2x de botten)
function pickPat2() {
  if (!bt.T.combo) return -1;
  const p = bt.T.pats.filter(i => i !== bt.pat && i !== 2);
  return p.length ? p[Math.random() * p.length | 0] : -1;
}
// pattern switch script
function setPat(n) { bt.pat = (n + PAT.length) % PAT.length; bt.t = 0; bt.tt = 0; bt.acc = 0; bt.g = undefined; bt.pause = 30; bt.bul = []; bt.pat2 = pickPat2(); }
// alle knop toggles
function onPress(k) {
  // I = muziek paneel (in de ow en in de editor)
  if (k === "i" && (mode === "world" || mode === "edit")) { toggleMusic(); return; }
  if (musicOpen) { if (k === "escape") toggleMusic(); return; }
  if (k === "m") toggleEdit();
  if (mode === "edit") { editKey(k); return; }
  if (k === "b") toggle();
  if (mode === "world" && (k === "e" || k === "enter" || k === " ")) act();
  if (mode !== "battle") return;
  if (k >= "1" && k <= "7") { bt.auto = false; setPat(+k - 1); }
  if (k === "n") { bt.auto = false; const p = bt.T.pats, i = p.indexOf(bt.pat); setPat(p[(i + 1) % p.length]); }
  if (k === "0") bt.auto = true;
}

const IS = 24; // grootte item
const SIDES = [
  { id: "up",    name: "bovenkant",   x: 188, y: 14,  col: "#4a90e2" },
  { id: "left",  name: "linkerkant",  x: 28,  y: 88,  col: "#4ae27a" },
  { id: "right", name: "rechterkant", x: 348, y: 88,  col: "#e24a8a" },
  { id: "back",  name: "achterkant",  x: 290, y: 36,  col: "#9a4ae2" },
  { id: "front", name: "voorkant",    x: 86,  y: 140, col: "#e2e24a" }
];
// elke doos hoort bij 1 wereld (world 0 of 1). skin = welk plaatje uit box/ (up, left, right, back, front)
const SKIN_IDS = SIDES.map(s => s.id), skinImgs = {};
const skinImg = k => skinImgs[k] || (skinImgs[k] = load("box/" + k + ".png"));
const skinCol = k => (SIDES.find(s => s.id === k) || {}).col || "#888";
function makeItem(o) {
  const skin = SKIN_IDS.includes(o.skin) ? o.skin : "up";
  return { id: o.id, skin, name: o.name || "doos", x: o.x, y: o.y, world: o.world ? 1 : 0, lines: o.lines || null, col: skinCol(skin), img: skinImg(skin), pop: 0 };
}
const defaultItems = () => SIDES.map(s => makeItem({ id: s.id, skin: s.id, name: s.name, x: s.x, y: s.y, world: 0 }));
const ITEMS = defaultItems();
const liveItems = () => ITEMS.filter(i => i.world === worldIdx);
const seen = new Set();

// hitbox systeem voor de dozen
const feetBox = (x = player.x, y = player.y) => ({ x: x + 2, y: y + 20, w: SPR_W - 4, h: SPR_H - 20 });
const itemBox = it => ({ x: it.x, y: it.y, w: IS, h: IS });
const overlap = (a, b, m = 0) => a.x < b.x + b.w + m && a.x + a.w > b.x - m && a.y < b.y + b.h + m && a.y + a.h > b.y - m;
const blocked = (x, y) => liveItems().some(it => overlap(feetBox(x, y), itemBox(it))) || solidRects().some(f => overlap(feetBox(x, y), f));
// kan kris die item aanraken?
const reachable = it => overlap(feetBox(), itemBox(it), 8);
// checkt item verte
function nearItem() {
  let best = null, bd = 1e9;
  const f = feetBox();
  for (const it of liveItems()) {
    if (!reachable(it)) continue;
    const d = Math.hypot(it.x + IS / 2 - (f.x + f.w / 2), it.y + IS / 2 - (f.y + f.h / 2));
    if (d < bd) { bd = d; best = it; }
  }
  return best;
}
// item inspecteren
function openItem(it) {
  it.pop = 30; ptr = null;
  const f = feetBox(), vx = it.x + IS / 2 - (f.x + f.w / 2), vy = it.y + IS / 2 - (f.y + f.h / 2);
  player.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "left" : "right") : (vy < 0 ? "up" : "down");
  player.frame = 0;
  const fill = t => String(t).replaceAll("{naam}", it.name).replaceAll("{pad}", "box/" + it.skin + ".png");
  const lines = (it.lines || DIALOOG[it.id] || ["* ..."]).map(fill);
  seen.add(it.id);
  if (!seen.done && ITEMS.every(b => seen.has(b.id))) { seen.done = true; lines.push(...(DIALOOG.alles || []).map(fill)); }
  if (!lines.length) lines.push("* ...");
  dlg = { lines, i: 0, c: 0, top: player.y + SPR_H / 2 - camY() > BASE_H / 2 };
}
// enter om de dialoog te skippen
function act() {
  if (dlg) {
    if (dlg.c < dlg.lines[dlg.i].length) dlg.c = dlg.lines[dlg.i].length;
    else if (++dlg.i >= dlg.lines.length) dlg = null;
    else dlg.c = 0;
    return;
  }
  const it = nearItem();
  if (it) openItem(it);
  else if (nearPoster(8)) startWarp();
}
// item shit
function clickWorld(p) {
  if (dlg) { act(); return true; }
  const x = p.x / SCALE + cam(), y = p.y / SCALE + camY();
  const it = liveItems().find(i => x >= i.x && x <= i.x + IS && y >= i.y && y <= i.y + IS);
  if (it && reachable(it)) { openItem(it); return true; }
  const po = posters().find(o => { const T = OBJ_TYPES[o.t]; return x >= o.x && x <= o.x + T.w && y >= o.y && y <= o.y + T.h; });
  if (po && touchPoster(po, 8)) { startWarp(); return true; }
  return false;
}

// rnd tussen a en b
const rnd = (a, b) => a + Math.random() * (b - a);
const orb = (x, y, vx, vy, r = 7) => bt.bul.push({ k: 0, x, y, vx: vx * bt.T.spd, vy: vy * bt.T.spd, r });
const rect = (x, y, w, h, vx, vy) => bt.bul.push({ k: 1, x, y, w, h, vx: vx * bt.T.spd, vy: vy * bt.T.spd });
const beam = (x, y, w, h) => bt.bul.push({ k: 2, x, y, w, h, age: bt.T.skip }); // skip = kortere waarschuwing
const hcx = () => bt.hx + HS / 2, hcy = () => bt.hy + HS / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PAT = [
  // 1 kogel regen
  { n: "Rain", f: t => { if (t % 6 === 0) orb(rnd(10, ZW - 10), -10, 0, 3 + rnd(0, 1.5) + t / 360); } },
  // 2 ventilator
  { n: "Fan", f: t => {
    if (t % 4 === 0) { const a = Math.PI / 2 + Math.sin(t * .045) * 1.15; orb(ZW / 2, 0, Math.cos(a) * 3, Math.sin(a) * 3, 6); }
    if (t > 300 && t % 8 === 0) { const a = -Math.PI / 2 + Math.sin(t * .05) * 1.1; orb(ZW / 2, ZH, Math.cos(a) * 3, Math.sin(a) * 3, 6); }
  } },
  // 3 flappy bird
  { n: "Bones", f: t => {
    if (t % 72 === 20) {
      const L = (t / 72 | 0) % 2 === 0, gap = 100, gy = rnd(30, ZH - gap - 30), v = (L ? 1 : -1) * (3.2 + t / 360), x = L ? -16 : ZW;
      rect(x, 0, 16, gy, v, 0); rect(x, gy + gap, 16, ZH - gy - gap, v, 0);
    }
  } },
  // 4 jevil
  { n: "Aimed", f: t => {
    if (t % 38 === 0) {
      const s = Math.random() * 4 | 0, sx = s === 0 ? 0 : s === 1 ? ZW : rnd(0, ZW), sy = s === 2 ? 0 : s === 3 ? ZH : rnd(0, ZH);
      const a = Math.atan2(hcy() - sy, hcx() - sx);
      for (const d of [-.22, 0, .22]) orb(sx, sy, Math.cos(a + d) * 3.4, Math.sin(a + d) * 3.4, 7);
    }
  } },
  // 5 asriel thunder
  { n: "Rude Buster", f: t => {
    if (t % 105 === 15) {
      const h = Math.random() < .5, p = (h ? hcy() : hcx()) - 18 + rnd(-30, 30);
      if (h) beam(0, clamp(p, 0, ZH - 36), ZW, 36); else beam(clamp(p, 0, ZW - 36), 0, 36, ZH);
    }
  } },
  // 6 links rechts ziel beweeg
  { n: "Curtain", f: t => {
    if (t % 52 === 0) {
      const cols = Math.floor(ZW / 28), x0 = (ZW - cols * 28) / 2 + 14;
      bt.g = clamp((bt.g ?? 5) + Math.round(rnd(-4, 4)), 0, cols - 4);
      for (let i = 0; i < cols; i++) if (i < bt.g || i >= bt.g + 4) orb(x0 + i * 28, -10, 0, 2.6, 8);
    }
  } },
  // 7 jevil deel 2
  { n: "Burst", f: t => {
    if (t % 58 === 0) {
      const x = rnd(80, ZW - 80), y = rnd(40, 160), o = Math.random() * 6.28;
      for (let i = 0; i < 16; i++) { const a = o + i * Math.PI / 8; orb(x, y, Math.cos(a) * 2.2, Math.sin(a) * 2.2, 6); }
    }
  } }
];

// raakt kogel hart?
function hit(b, cx, cy) {
  if (b.k === 0) return Math.hypot(b.x - cx, b.y - cy) < b.r + 9;
  if (b.k === 2 && !(b.age >= 40 && b.age < 62)) return false;
  const nx = clamp(cx, b.x, b.x + b.w), ny = clamp(cy, b.y, b.y + b.h);
  return Math.hypot(nx - cx, ny - cy) < 9;
}

// =====================
// enemies in de ow (lopen heen en weer tussen 2 boxen)
// =====================
// zelfde mapjes als kris, maar dan /enemy/ (down_0..3, up_0..3, left_0..1, right_0..1)
// de 4 soorten, van makkelijk naar extreem.
// pats = welke aanvallen (0 Rain, 1 Fan, 2 Bones, 3 Aimed, 4 Rude Buster straal, 5 Curtain, 6 Burst)
// spd = kogel snelheid, rate = hoe snel aanvallen kogels maken, dmg = schade, time = seconden gevecht
// skip = straal waarschuwing korter (frames), switch = elke zoveel frames een nieuwe aanval (0 = nooit), combo = 2 aanvallen tegelijk
// speed = loopsnelheid in de ow, chase = (alleen rakuichi) rent achter kris aan binnen zoveel pixels
const ETYPES = [
  { id: 1, name: "gemene buster",     col: "#6ee06e", speed: 0.7, chase: 0,   chaseSpeed: 0,   pats: [0, 1, 3],                spd: 0.8,  rate: 0.8,  dmg: 0.7, time: 12, skip: 0,  switch: 0,   combo: false },
  { id: 2, name: "gemenere buster",    col: "#e2e24a", speed: 0.9, chase: 0,   chaseSpeed: 0,   pats: [0, 1, 3, 5],             spd: 1.0,  rate: 1.0,  dmg: 1.0, time: 15, skip: 0,  switch: 0,   combo: false },
  { id: 3, name: "onbeleefde buster", col: "#f08a30", speed: 1.1, chase: 0,   chaseSpeed: 0,   pats: [0, 1, 2, 3, 4, 5],       spd: 1.2,  rate: 1.25, dmg: 1.3, time: 20, skip: 8,  switch: 420, combo: false },
  { id: 4, name: "rakuichi en buster", col: "#e02a3a", speed: 1.2, chase: 100, chaseSpeed: 1.4, pats: [0, 1, 2, 3, 4, 5, 6],    spd: 1.45, rate: 1.5,  dmg: 1.7, time: 30, skip: 16, switch: 360, combo: true }
];
const etype = e => ETYPES[clamp((e.type | 0) || 1, 1, 4) - 1];
// sprites: enemy/1/ .. enemy/4/ (down_0..3, up_0..3, left_0..1, right_0..1). ontbreekt er 1? dan de oude enemy/ map. anders een gekleurd vak
function loadSet(dir, fb) {
  const mk = (n, c) => Array.from({ length: c }, (_, i) => {
    const im = new Image();
    im.onerror = () => { im.onerror = null; im.src = fb + n + "_" + i + ".png"; };
    im.src = dir + n + "_" + i + ".png";
    return im;
  });
  return { down: mk("down", 4), left: mk("left", 2), right: mk("right", 2), up: mk("up", 4) };
}
const enemySets = ETYPES.map(T => loadSet("enemy/" + T.id + "/", "enemy/"));
const eImgs = e => enemySets[etype(e).id - 1];
// aanraak hitbox (hele lijf)
const bodyBox = (x, y) => ({ x: x + 2, y: y + 8, w: SPR_W - 4, h: SPR_H - 8 });
// patrouille punt i (0 of 1) van enemy e: naast een box. side -1 = links van de box, 1 = rechts
function patrolPoint(e, i) {
  const p = e.pts[i];
  if (p.id === undefined) return { x: p.x, y: p.y }; // vaste plek
  const box = ITEMS.find(b => b.id === p.id);
  if (!box) return { x: e.x || 0, y: e.y || 0 };
  return { x: p.side < 0 ? box.x - SPR_W - 4 : box.x + IS + 6, y: box.y - 2 };
}
function makeEnemy(a, b, world = 0, type = 1, mus = 0) {
  const e = { pts: [a, b], world, type: clamp((type | 0) || 1, 1, 4), mus: clamp(mus | 0, 0, 5), x: 0, y: 0, chasing: false, dir: "down", frame: 0, timer: 0, moving: true, wait: 0, to: 1, cool: 0, alive: true };
  Object.assign(e, patrolPoint(e, 0));
  return e;
}
// enemy 1: tussen up en left box. enemy 2: aan de overkant, tussen de onderkant en de right box
const defaultEnemies = () => [
  makeEnemy({ id: "up", side: -1 }, { id: "left", side: 1 }),
  makeEnemy({ x: 168, y: 162 }, { id: "right", side: -1 }, 0, 2) // onderin (waar de oranje box stond) <-> right box
];
const enemies = defaultEnemies();
const liveEnemies = () => enemies.filter(e => e.world === worldIdx);
let fighting = null; // tegen welke enemy vecht kris (die verdwijnt na het gevecht)
// na een gevecht: elke enemy begint bij het punt dat het verst van kris af is + even niet aanraakbaar
function respawnEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const p0 = patrolPoint(e, 0), p1 = patrolPoint(e, 1);
    const far = Math.hypot(p0.x - player.x, p0.y - player.y) > Math.hypot(p1.x - player.x, p1.y - player.y) ? 0 : 1;
    Object.assign(e, patrolPoint(e, far));
    e.to = 1 - far; e.wait = 30; e.cool = 90;
  }
}
function updateEnemy(e) {
  const T = etype(e);
  if (e.cool > 0) e.cool--;
  // rakuichi buster: rent achter kris aan als ze dichtbij komt (blijft 40% langer achter haar aan)
  if (T.chase && e.cool <= 0 && !dlg) {
    const vx = player.x - e.x, vy = player.y - e.y, d = Math.hypot(vx, vy);
    e.chasing = d < T.chase * (e.chasing ? 1.4 : 1);
    if (e.chasing && d > 0.5) {
      const s = Math.min(T.chaseSpeed, d), nx = e.x + vx / d * s, ny = e.y + vy / d * s;
      if (inWorld(nx, ny)) { e.x = nx; e.y = ny; }
      e.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "left" : "right") : (vy < 0 ? "up" : "down");
      e.moving = true; e.wait = 0;
      if (++e.timer >= 6) { e.frame++; e.timer = 0; }
      e.frame %= eImgs(e)[e.dir].length;
      return;
    }
  }
  // even wachten bij een box
  if (e.wait > 0) { e.wait--; e.moving = false; e.frame = 0; return; }
  const t = patrolPoint(e, e.to), vx = t.x - e.x, vy = t.y - e.y, d = Math.hypot(vx, vy);
  if (d <= T.speed) {
    // aangekomen: wacht en loop terug naar de andere box
    e.x = t.x; e.y = t.y; e.to = 1 - e.to; e.wait = 60; e.moving = false; e.frame = 0;
    return;
  }
  e.x += vx / d * T.speed; e.y += vy / d * T.speed;
  e.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "left" : "right") : (vy < 0 ? "up" : "down");
  e.moving = true;
  if (++e.timer >= 10) { e.frame++; e.timer = 0; }
  e.frame %= eImgs(e)[e.dir].length;
}

function updateWorld() {

  player.moving = !!(dx || dy);
  moveAxis("x", dx * player.speed);
  moveAxis("y", dy * player.speed);

  if (dy < 0) player.dir = "up";
  if (dx < 0) player.dir = "left";
  if (dx > 0) player.dir = "right";
  if (player.moving) {
    if (++player.timer >= 8) { player.frame++; player.timer = 0; }
  } else player.frame = 0;
  player.frame %= kris[player.dir].length;

  // enemy loopt rond. raak je hem aan => gevecht
  for (const e of liveEnemies()) {
    if (!e.alive) continue;

  }

function updateBattle() {

      toggle();
    }

  }
  // aftellen. op 0 is het gevecht klaar

    bt.t++;

  if (bt.inv > 0) bt.inv--;

// teken
// =====================
// teken de tekst
function text(s, x, y, size, col, al) {
  ctx.font = size + "px " + FONT; ctx.fillStyle = col || "#fff"; ctx.textAlign = al || "left"; ctx.textBaseline = "top"; ctx.fillText(s, x, y);
}
// teken kris of een placeholder
function drawKris() {
  const imgs = kris[player.dir], img = imgs[player.frame % imgs.length];
  const x = Math.floor(player.x * SCALE), y = Math.floor(player.y * SCALE), w = SPR_W * SCALE, h = SPR_H * SCALE;
  if (img && img.complete && img.naturalWidth) { ctx.drawImage(img, x, y, w, h); return; }
  const s = SCALE; // kris placeholder
  ctx.fillStyle = "#FF0000"; // rood kleur
  ctx.fillRect(x, y, 16 * s, 16 * s); // vierkant blok
}

// witte versie van een sprite (voor de outline), 1x per plaatje gemaakt
const tintCache = new Map();
function whiteOf(img) {
  let c = tintCache.get(img);
  if (!c) {
    c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext("2d"); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = "source-in"; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    tintCache.set(img, c);
  }
  return c;
}
// teken de enemy: sprite uit /enemy/ met een 1 pixel witte outline om de vorm, anders een wit vak
function drawEnemy(e) {
  const T = etype(e), imgs = eImgs(e)[e.dir];
  let img = imgs[e.frame % imgs.length];
  if (!(img.complete && img.naturalWidth)) img = imgs[0]; // ontbrekend frame: pak frame 0
  const x = Math.floor(e.x * SCALE), y = Math.floor(e.y * SCALE), w = SPR_W * SCALE, h = SPR_H * SCALE;
  if (img && img.complete && img.naturalWidth) {
    const white = whiteOf(img), o = SCALE;
    for (const [ox, oy] of [[-o, 0], [o, 0], [0, -o], [0, o]]) ctx.drawImage(white, x + ox, y + oy, w, h);
    ctx.drawImage(img, x, y, w, h);
    return;
  }
  // nog geen sprite: gekleurd vak met het nummer van de soort
  ctx.fillStyle = T.col; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  text(String(T.id), x + w / 2, y + h / 2 - 14, 28, "#000", "center");
}

// frame ow
function drawWorld() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  ctx.save(); ctx.translate(-Math.round(cam() * SCALE), -Math.round(camY() * SCALE));
  // eerst alle muren (rand om elke ruimte), dan de vloeren er overheen zodat de deuropening open is
  ctx.fillStyle = "#555";
  for (const a of areas) ctx.fillRect((a.x - 2) * SCALE, (a.y - 2) * SCALE, (a.w + 4) * SCALE, (a.h + 4) * SCALE);
  for (const a of areas) drawArea(a);
  for (const o of objs) if (OBJ_TYPES[o.t].flat) drawObj(o);
  const near = (dlg || mode === "edit") ? null : nearItem(), feet = player.y + SPR_H;
  for (const it of liveItems()) if (it.y + IS <= feet) drawItem(it, near);
  // kris en de enemies op volgorde van y (wie lager staat komt voor)
  const order = liveEnemies().filter(e => e.alive || mode === "edit").map(e => ({ y: e.y + SPR_H, f: () => drawEnemy(e) }));
  order.push({ y: player.y + SPR_H, f: drawKris });
  for (const o of objs) { const T = OBJ_TYPES[o.t]; if (!T.flat) order.push({ y: objBase(o), f: () => drawObj(o) }); }
  order.sort((p, q) => p.y - q.y).forEach(o => o.f());
  for (const it of liveItems()) if (it.y + IS > feet) drawItem(it, near);
  if (mode === "edit") drawEditOverlay();
  ctx.restore();
  if (mode === "edit") drawEditHud();
  text("", 12, canvas.height - 28, 18, "#666");
  if (warp) { ctx.fillStyle = "rgba(0,0,0," + (warp.t <= 18 ? warp.t / 18 : (36 - warp.t) / 18) + ")"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  if (dlg) drawDialog();
}
// teken de items in de ow
function drawItem(it, near) {
  const w = IS * SCALE, x = it.x * SCALE, y = it.y * SCALE - Math.abs(Math.sin(it.pop / 30 * Math.PI)) * 14;
  if (it.img.complete && it.img.naturalWidth) ctx.drawImage(it.img, x, y, w, w);
  else {
    ctx.fillStyle = it.col; ctx.fillRect(x, y, w, w);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, w - 3);
    text(it.id, x + w / 2, y + w / 2 - 8, 16, "#000", "center");
  }
  if (it === near) {
    ctx.strokeStyle = "#ff0"; ctx.lineWidth = 3; ctx.strokeRect(x - 4, y - 4, w + 8, w + 8);
    const b = Math.sin(fr / 8) * 4;
    ctx.fillStyle = "#ff0"; ctx.beginPath(); ctx.moveTo(x + w / 2 - 9, y - 24 + b); ctx.lineTo(x + w / 2 + 9, y - 24 + b); ctx.lineTo(x + w / 2, y - 10 + b); ctx.fill();
  }
}
// ut dialoog doos
function drawDialog() {
  const bw = canvas.width - 72, bh = 150, bx = 36, by = dlg.top ? 24 : canvas.height - bh - 24;
  ctx.fillStyle = "#000"; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; ctx.strokeRect(bx + 3, by + 3, bw - 6, bh - 6);
  const L = dlg.lines[dlg.i];
  text(L.slice(0, dlg.c | 0), bx + 32, by + 36, 34, "#fff");
  if (dlg.c >= L.length && (fr >> 4) % 2 === 0) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(bx + bw - 60, by + bh - 52); ctx.lineTo(bx + bw - 36, by + bh - 52); ctx.lineTo(bx + bw - 48, by + bh - 34); ctx.fill();
  }
}
// kogels
const img = new Image();
img.src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2eKATPvhAnn2jKq_17zCdK8ai_Fwun9sK20yGXeqing&s=10"; 

function drawSquare(x, y, s) {
  if (!img.complete) return;
  ctx.drawImage(img, x - s, y - s, s * 2, s * 2);
}
// teken alle kogels
function drawBullets() {
  for (const b of bt.bul) {
    if (b.k === 0) drawSquare(b.x, b.y, b.r * 1.3);
    else if (b.k === 1) { ctx.fillStyle = "#fff"; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.fillStyle = "#cfcfcf"; ctx.fillRect(b.x + 4, b.y, b.w - 8, b.h); }
    else if (b.age < 40) {
      ctx.fillStyle = b.age % 8 < 4 ? "rgba(255,60,172,.9)" : "rgba(255,255,255,.7)";
      if (b.w > b.h) ctx.fillRect(b.x, b.y + b.h / 2 - 2, b.w, 4); else ctx.fillRect(b.x + b.w / 2 - 2, b.y, 4, b.h);
    } else {
      ctx.globalAlpha = Math.min(1, (62 - b.age) / 12); ctx.fillStyle = "#ff3cac"; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = "#fff"; if (b.w > b.h) ctx.fillRect(b.x, b.y + 10, b.w, b.h - 20); else ctx.fillRect(b.x + 10, b.y, b.w - 20, b.h);
      ctx.globalAlpha = 1;
    }
  }
}
// bt frame
function drawBattle() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save(); ctx.translate(ZX, ZY);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, ZW, ZH);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, ZW, ZH); ctx.clip();
  drawBullets();
  if (bt.dead === 0 && (bt.inv <= 0 || (bt.inv >> 2) % 2 === 0)) ctx.drawImage(heartImg, bt.hx, bt.hy, HS, HS);
  ctx.restore();
  ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 2; ctx.lineJoin = "miter"; ctx.strokeRect(-1, -1, ZW + 2, ZH + 2);
  ctx.restore();
  const sec = Math.ceil(bt.left / 60);
  text(String(sec), canvas.width / 2, 40, 48, sec <= 5 ? "#f33" : "#fff", "center");
  text(bt.T.name + "  LV " + bt.T.id, 24, 24, 28, bt.T.col);
  ctx.fillStyle = "#f00"; ctx.fillRect(ZX + 310, 512, 100, 28); ctx.fillStyle = "#ff0"; ctx.fillRect(ZX + 310, 512, 5 * bt.hp, 28);
  if (bt.dead > 0) { ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(0, 0, canvas.width, canvas.height); text("DOOD", canvas.width / 2, 230, 64, "#fff", "center"); text("Womp Womp", canvas.width / 2, 320, 22, "#aaa", "center"); }
}
// bt intro
function drawTrans() {
  drawWorld();
  ctx.fillStyle = "rgba(0,0,0," + tr / 60 + ")"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const sx = (player.x + SPR_W / 2 - cam()) * SCALE, sy = (player.y + 14 - camY()) * SCALE;
  const ex = ZX + (ZW) / 2, ey = ZY + ZH * 0.65 + HS / 2, p = Math.max(0, (tr - 24) / 26);
  if (tr >= 24 || (tr >> 3) % 2 === 0) ctx.drawImage(heartImg, sx + (ex - sx) * p - HS / 2, sy + (ey - sy) * p - HS / 2, HS, HS);
}
// Pick the right drawing for the current mode
function draw() {
  if (mode === "world" || mode === "edit") drawWorld(); else if (mode === "trans") drawTrans(); else drawBattle();
}
// check of ow of bt is
// =====================
// 60 fps loop
// =====================
// loopt de spel op 60 fps
let last = performance.now(), acc = 0;
function loop(n) {
  acc += Math.min(100, n - last); last = n;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  padSync();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
