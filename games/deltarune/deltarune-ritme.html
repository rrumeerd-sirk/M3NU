<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deltarune Rhythm – 30 seconds</title>
<style>
:root{color-scheme:dark;--bg:#05030f;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
canvas{max-width:100%;max-height:100%;aspect-ratio:480/640;background:#000;border:4px solid #fff;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=480,H=640;
const COL=['#ff4fd8','#4fe0ff','#ffe94f','#7dff6b'];
const KEYS={a:0,s:1,d:2,f:3,A:0,S:1,D:2,F:3};
const BPM=140,beat=60/BPM,LEAD=4*beat,FALL=1.4,HITY=540,LANE_W=88,X0=(W-LANE_W*4)/2,DUR=30;
let state='menu',ac,t0,notes=[],flash=[0,0,0,0],judge={t:'',c:'#fff',at:-9},pulse=0;

function rng(seed){return()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296}
function makePattern(){
  const r=rng(7),out=[];let last=-1;
  for(let b=0;b<=58;b+=0.5){
    const whole=Number.isInteger(b);
    if(whole||(b>=8&&r()<0.35)){
      let l;do{l=Math.floor(r()*4)}while(l===last&&r()<0.7);
      last=l;out.push({lane:l,time:LEAD+b*beat,hit:false,done:false});
    }
  }
  return out;
}
function tone(f,t,d,type,v){
  const o=ac.createOscillator(),gn=ac.createGain();
  o.type=type;o.frequency.value=f;
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+0.02);
}
function scheduleMusic(){
  const bass=[110,110,87.3,98],arp=[220,261.6,329.6,392,329.6,261.6];
  for(let i=0;i*beat<DUR;i++){
    const t=t0+i*beat;
    tone(bass[Math.floor(i/4)%4],t,beat*0.9,'triangle',0.28);
    tone(arp[i%6]*(i%8<4?1:1.5),t,beat*0.4,'square',0.05);
    tone(arp[(i+2)%6]*2,t+beat/2,beat*0.3,'square',0.035);
    if(i%2===1)tone(60,t,0.12,'sine',0.35);
  }
}
function start(){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  ac.resume();
  notes=makePattern();
  t0=ac.currentTime+0.4;scheduleMusic();state='play';
}
function now(){return ac.currentTime-t0}
function press(l){
  if(state==='menu'||state==='end'){ if(state==='end'&&performance.now()<endLock)return; start();return}
  flash[l]=1;
  const s=now();let best=null;
  for(const n of notes)if(n.lane===l&&!n.done&&Math.abs(n.time-s)<=0.16&&(!best||n.time<best.time))best=n;
  if(!best){return}
  const d=Math.abs(best.time-s);best.done=true;best.hit=true;
  judge=d<=0.07?{t:'PERFECT!',c:'#ffe94f',at:s}:{t:'GOOD',c:'#4fe0ff',at:s};
  tone(880+l*110,ac.currentTime,0.08,'square',0.12);
}
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key in KEYS){e.preventDefault();press(KEYS[e.key])}else if(e.key===' '||e.key==='Enter'){if(state!=='play')press(0)}});
c.addEventListener('pointerdown',e=>{
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;
  press(Math.max(0,Math.min(3,Math.floor((x-X0)/LANE_W))));
});
let endLock=0;

function arrow(x,y,l,sz,fill,stroke){
  g.save();g.translate(x,y);g.rotate([Math.PI/2*3,0,Math.PI,Math.PI/2][l]*0+[ -Math.PI/2, 0, Math.PI, Math.PI/2 ][[1,0,2,3].indexOf(l)===-1?0:0]);
  g.restore();
  g.save();g.translate(x,y);
  g.rotate({0:Math.PI,1:-Math.PI/2,2:Math.PI/2,3:0}[l]);
  g.beginPath();g.moveTo(sz,0);g.lineTo(-sz*0.2,-sz);g.lineTo(-sz*0.2,-sz*0.4);g.lineTo(-sz,-sz*0.4);g.lineTo(-sz,sz*0.4);g.lineTo(-sz*0.2,sz*0.4);g.lineTo(-sz*0.2,sz);g.closePath();
  if(fill){g.fillStyle=fill;g.fill()}
  if(stroke){g.lineWidth=3;g.strokeStyle=stroke;g.stroke()}
  g.restore();
}
function heart(x,y,s,col){
  g.fillStyle=col;g.beginPath();
  g.moveTo(x,y+s*0.9);g.bezierCurveTo(x-s*1.6,y-s*0.2,x-s*0.6,y-s*1.1,x,y-s*0.35);
  g.bezierCurveTo(x+s*0.6,y-s*1.1,x+s*1.6,y-s*0.2,x,y+s*0.9);g.fill();
}
function text(t,x,y,sz,col,al){g.font='bold '+sz+'px "Courier New",monospace';g.textAlign=al||'center';g.fillStyle=col||'#fff';g.fillText(t,x,y)}

function frame(){
  const s=state==='play'?now():0;
  g.fillStyle='#05030f';g.fillRect(0,0,W,H);
  // grid
  g.strokeStyle='#1a1450';g.lineWidth=1;
  const off=(s*60)%40;
  for(let y=-40+off;y<H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  for(let x=0;x<=W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  // lanes
  for(let l=0;l<4;l++){
    const x=X0+l*LANE_W;
    g.fillStyle='rgba(0,0,0,.65)';g.fillRect(x,0,LANE_W,H);
    if(flash[l]>0){g.fillStyle=COL[l]+Math.floor(flash[l]*70).toString(16).padStart(2,'0');g.fillRect(x,0,LANE_W,H);flash[l]=Math.max(0,flash[l]-0.08)}
    g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(x,0,LANE_W,H);
    arrow(x+LANE_W/2,HITY,l,26,null,COL[l]);
    text(['A','S','D','F'][l],x+LANE_W/2,HITY+62,22,COL[l]);
  }
  if(state==='menu'){
    heart(W/2,150,28,'#ff2a2a');
    text('DELTARUNE',W/2,230,44,'#ffe94f');
    text('RHYTHM · 30 SEC',W/2,270,24,'#4fe0ff');
    text('Keys: A  S  D  F',W/2,350,18);
    text('or tap the lanes',W/2,376,18);
    text('Press to start',W/2,460,22,'#ff4fd8');
  }
  if(state==='play'){
    for(const n of notes){
      if(n.done)continue;
      const y=HITY-(n.time-s)/FALL*(HITY+20);
      if(y<-40)continue;
      if(s-n.time>0.16){n.done=true;judge={t:'MISS',c:'#ff4455',at:s};continue}
      arrow(X0+n.lane*LANE_W+LANE_W/2,y,n.lane,26,COL[n.lane],'#fff');
    }
    // heart pulse on beat
    const bp=1-((s/beat)%1);
    heart(W/2,60,14+bp*5,'#ff2a2a');
    text('TIME '+Math.max(0,Math.ceil(DUR-s)),W-14,30,18,'#fff','right');
    g.fillStyle='#333';g.fillRect(14,100,W-28,8);g.fillStyle='#ffe94f';g.fillRect(14,100,(W-28)*Math.min(1,s/DUR),8);
    if(s-judge.at<0.5)text(judge.t,W/2,HITY-90,28,judge.c);
    if(s>=DUR){
      state='end';endLock=performance.now()+700;
    }
  }
  if(state==='end'){
    g.fillStyle='rgba(0,0,0,.82)';g.fillRect(0,0,W,H);
    heart(W/2,200,28,'#ff2a2a');
    text('DONE!',W/2,300,48,'#ffe94f');
    text('Press to play again',W/2,400,20,'#ff4fd8');
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
