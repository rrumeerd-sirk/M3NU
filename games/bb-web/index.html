<!DOCTYPE html> 
<html lang="en-us"><head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,user-scalable=no">
    <base href="/beatblock-web/">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Beatblock</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas id="canvas" style="display: block; cursor: default;" width="1200" height="720"></canvas>
    <div id="spinner" class=""></div>
    <script>
      (async () => {
        const parts = [
          "game.love.part000",
          "game.love.part001",
          "game.love.part002",
          "game.love.part003",
          "game.love.part004",
        ];
        const buffers = await Promise.all(
          parts.map((p) => fetch(p).then((r) => r.arrayBuffer())),
        );
        const merged = new Blob(buffers, { type: "application/octet-stream" });
        const url = URL.createObjectURL(merged);
        const s = document.createElement("script");
        s.src = "player.js?g=" + encodeURIComponent(url) + "&n=1";
        document.body.appendChild(s);
      })();
    </script>
  

<script src="player.js&amp;n=1"></script><script type="text/javascript" src="11.5/compat/love.js" async=""></script></body></html>
